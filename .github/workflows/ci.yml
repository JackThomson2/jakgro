name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Test match tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate search acceptance contracts
        run: python3 tools/validate_acceptance_contract.py

      - name: Build release binary
        run: cargo build --release --locked

      - name: Gate the tuned Aggression profile
        run: python3 tools/measure_style.py --engine target/release/jakgro --check

      - name: Gate the frozen sacrifice controls
        run: >-
          python3 tools/measure_style.py
          --engine target/release/jakgro
          --suite tests/data/sacrifice-gates.epd
          --check

      - name: Check the reproducible match command
        run: python3 tools/run_match.py --engine target/release/jakgro --dry-run

  msrv:
    name: Check Rust 1.85 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Check all targets
        run: cargo check --all-targets --locked
